<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Security Alert | BankEase</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #10b981;
            --dark: #1e293b;
            --light: #f8fafc;
            --surface: #ffffff;
            --text: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --radius-lg: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e2e8f0 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }

        .error-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            max-width: 500px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(135deg, var(--error) 0%, #f59e0b 100%);
        }

        .shield-icon-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }

        .status-pill {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
            padding: 0.35rem 0.85rem;
            border-radius: 50px;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.75rem;
        }

        .error-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary-action {
            background: var(--primary);
            color: white;
            border: none;
        }

        .btn-primary-action:hover {
            background: var(--primary-dark);
            color: white;
            transform: translateY(-1px);
        }

        .btn-secondary-action {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            margin-top: 0.75rem;
        }

        .btn-secondary-action:hover {
            background: #f8fafc;
            color: var(--dark);
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="shield-icon-container">
        <i class="fas fa-shield-alt"></i>
    </div>

    <span class="status-pill" th:text="'HTTP ' + ${statusCode}">HTTP 404</span>

    <h1 class="error-title">Protected or Invalid URL</h1>

    <p class="error-desc" th:text="${errorMessage}">
        The page you attempted to access cannot be found or is restricted. For your security, access was blocked.
    </p>

    <!-- Navigation based on authentication state -->
    <div th:if="${isLoggedIn}">
        <a href="/dashboard" class="btn-action btn-primary-action">
            <i class="fas fa-home"></i> Return to Secure Dashboard
        </a>
        <a href="/profile" class="btn-action btn-secondary-action">
            <i class="fas fa-user"></i> Go to Profile
        </a>
    </div>

    <div th:unless="${isLoggedIn}">
        <a href="/login" class="btn-action btn-primary-action">
            <i class="fas fa-lock"></i> Go to Customer Login
        </a>
        <a href="/register" class="btn-action btn-secondary-action">
            <i class="fas fa-user-plus"></i> Open New Account
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
