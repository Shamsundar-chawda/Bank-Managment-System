spring.application.name=bankapp
server.port=8080

# Configure both values through environment variables to enable the admin portal.
bank.admin.username=${BANK_ADMIN_USERNAME:}
bank.admin.password=${BANK_ADMIN_PASSWORD:}

# Persistent H2 Database configuration (saves data to local disk in ./data/bank_db)
spring.datasource.url=jdbc:h2:file:./data/bank_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL Database configuration (uncomment if you have MySQL running)
# spring.datasource.url=jdbc:mysql://localhost:3306/bank_db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security & Session Settings
server.servlet.session.timeout=15m
server.error.whitelabel.enabled=false

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
